<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Website Title -->
    <title>Hostel Complaint Management System - Admin Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Admin Dashboard</h1>

    <div class="box">

        <h2>All Student Complaints</h2>

        {% for complaint in complaints %}

        <div class="complaint-card">

            <h3>{{ complaint[1] }}</h3>

            <p>{{ complaint[2] }}</p>

            {% if complaint[3] == "Pending" %}

                <span class="pending">
                    {{ complaint[3] }}
                </span>

            {% else %}

                <span class="resolved">
                    {{ complaint[3] }}
                </span>

            {% endif %}

            <br><br>

            <!-- RESOLVE BUTTON -->
            <form action="/resolve/{{ complaint[0] }}"
                  method="POST">

                <button type="submit">
                    Resolve
                </button>

            </form>

            <br>

            <!-- PENDING BUTTON -->
            <form action="/pending/{{ complaint[0] }}"
                  method="POST">

                <button type="submit">
                    Pending
                </button>

            </form>

        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- Website Title -->
    <title>Hostel Complaint Management System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <!-- Student Section -->
    <div class="box">

        <h1>Hostel Complaint Management System</h1>

        <h2>Student Register</h2>

        <form action="/register" method="POST">

            <input type="text"
                   name="username"
                   placeholder="Enter Username"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Enter Password"
                   required>

            <button type="submit">
                Register
            </button>

        </form>

        <hr><br>

        <h2>Student Login</h2>

        <form action="/login" method="POST">

            <input type="text"
                   name="username"
                   placeholder="Enter Username"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Enter Password"
                   required>

            <button type="submit">
                Login
            </button>

        </form>

        <hr><br>

        <h2>Submit Complaint</h2>

        <form action="/complaint" method="POST">

            <input type="text"
                   name="username"
                   placeholder="Enter Username"
                   required>

            <textarea name="complaint"
                      placeholder="Write Complaint Here..."
                      required></textarea>

            <button type="submit">
                Submit Complaint
            </button>

        </form>

    </div>

    <!-- Admin Section -->
    <div class="box">

        <h2>Admin Register</h2>

        <form action="/admin_register" method="POST">

            <input type="text"
                   name="username"
                   placeholder="Admin Username"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Admin Password"
                   required>

            <button type="submit">
                Register
            </button>

        </form>

        <hr><br>

        <h2>Admin Login</h2>

        <form action="/admin_login" method="POST">

            <input type="text"
                   name="username"
                   placeholder="Admin Username"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Admin Password"
                   required>

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</div>

</body>
</html>

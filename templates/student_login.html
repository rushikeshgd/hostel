<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        Hostel CMS
    </div>

    <ul>

        <li>
            <a href="/">Home</a>
        </li>

        <li>
            <a href="/student_register">
                Register
            </a>
        </li>

    </ul>

</nav>


<div class="form-container">

    <div class="form-box">

        <h2>

            <i class="fas fa-user"></i>

            Student Login

        </h2>


        <!-- FLASH MESSAGE -->

        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="flash-message">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form action="/login"
              method="POST">

            <input type="text"
                   name="username"
                   placeholder="Enter Username"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Enter Password"
                   required>

            <button type="submit">

                Login

            </button>

        </form>

        <p class="bottom-text">

            Don't have account?

            <a href="/student_register">
                Register
            </a>

        </p>

    </div>

</div>

</body>

</html>
